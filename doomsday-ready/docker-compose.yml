services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doomsday
      POSTGRES_USER: doomsday
      POSTGRES_PASSWORD: doomsday
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomsday -d doomsday"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: doomsday
      POSTGRES_USER: doomsday
      POSTGRES_PASSWORD: doomsday
      DEBUG: "0"
      SECRET_KEY: change-me-in-real-life
      MEDIA_ROOT: /app/media
      SEED_DEMO: "1"   # loads the sample movies and cinemas; set to 0 to start empty
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  media:
